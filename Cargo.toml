[workspace]
resolver = "2"
members = [
    "crates/explorer-common",
    "crates/explorer-net",
    "crates/explorer-dom",
    "crates/explorer-html",
    "crates/explorer-css",
    "crates/explorer-js",
    "crates/explorer-layout",
    "crates/explorer-render",
    "crates/explorer-core",
    "crates/explorer-api",
    "crates/explorer-cli",
    "crates/explorer-daemon",
    "crates/explorer-test-support",
    # Moteur JavaScript de l'équipe dédiée (ADR-0007) — nom de produit
    # propre, adapté derrière `explorer-js::JsEngine` en phase 8.
    "crates/dillo-js",
]

[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["Laurent Geynet"]

[workspace.dependencies]
# Crates internes — sens des dépendances : voir AGENTS.md §2.
explorer-common = { path = "crates/explorer-common" }
explorer-net = { path = "crates/explorer-net" }
explorer-dom = { path = "crates/explorer-dom" }
explorer-html = { path = "crates/explorer-html" }
explorer-css = { path = "crates/explorer-css" }
explorer-js = { path = "crates/explorer-js" }
explorer-layout = { path = "crates/explorer-layout" }
explorer-render = { path = "crates/explorer-render" }
explorer-core = { path = "crates/explorer-core" }
explorer-api = { path = "crates/explorer-api" }
explorer-test-support = { path = "crates/explorer-test-support" }
dillo-js = { path = "crates/dillo-js" }

# Crates externes — pur Rust uniquement (AGENTS.md §4.2),
# pin mineur, ≥ 7 jours depuis publication.
thiserror = "2.0"
# Stack texte ADR-0009 (explorer-layout) — shaping/itemisation
# purs, aucun I/O (fontdb reste en couche infra, port
# FontSource côté layout).
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
ttf-parser = "0.25"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# Moteur regex de dillo-js (pur Rust) — lookahead/backrefs non
# supportés, dégradation SyntaxError documentée (ADR-0007).
regex = "1.11"
# IDNA/punycode UTS-46 pour explorer-net::url (ADR-0002, étape 3) —
# pur Rust, pas de *-sys.
idna = "1.0"
# Tables Unicode XID_Start/XID_Continue pour les identifiants JS
# (dillo-js lexer) — `char::is_alphabetic` n'implémente ni UAX #31
# ni les exclusions Pattern_Syntax (ex. U+2E2F). Pur Rust.
unicode-ident = "1.0"
# Pile réseau explorer-net (ADR-0002) — tokio sockets/timers,
# httparse wire-format HTTP/1.1, async-trait pour les transports
# injectables (HttpTransport/Connector dyn-compatibles).
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync"] }
httparse = "1.9"
async-trait = "0.1"
# TLS explorer-net (ADR-0002, étape 5) — rustls + webpki-roots.
# Provider crypto `ring` : exception *-sys* consignée dans l'ADR —
# aucune pile TLS viable n'est 100 % Rust ; `ring` se build sur
# Windows sans cmake (contrairement à aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
# Décodage corps explorer-net (ADR-0002, étape 6) — pur Rust :
# flate2 sur miniz_oxide (gzip/deflate), brotli, encoding_rs
# (transcodage charset WHATWG — la référence de Firefox).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "7"
encoding_rs = "0.8"
# Cookies explorer-net (ADR-0002, étape 7) — Public Suffix List
# embarquée : sans elle, un jar naïf accepte les supercookies
# `.co.uk`. Pur Rust.
psl = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
