[workspace]
resolver = "2"
members = [
    "crates/explorer-common",
    "crates/explorer-net",
    "crates/explorer-dom",
    "crates/explorer-html",
    "crates/explorer-css",
    "crates/explorer-js",
    "crates/explorer-layout",
    "crates/explorer-render",
    "crates/explorer-core",
    "crates/explorer-api",
    "crates/explorer-cli",
    "crates/explorer-ffi",
    "crates/explorer-daemon",
    "crates/explorer-test-support",
    # Moteur JavaScript de l'équipe dédiée (ADR-0007) — nom de produit
    # propre, adapté derrière `explorer-js::JsEngine` en phase 8.
    "crates/explorer-jscore",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["Laurent Geynet"]

[workspace.dependencies]
# Crates internes — sens des dépendances : voir AGENTS.md §2.
explorer-common = { path = "crates/explorer-common" }
explorer-net = { path = "crates/explorer-net" }
explorer-dom = { path = "crates/explorer-dom" }
explorer-html = { path = "crates/explorer-html" }
explorer-css = { path = "crates/explorer-css" }
explorer-js = { path = "crates/explorer-js" }
explorer-layout = { path = "crates/explorer-layout" }
explorer-render = { path = "crates/explorer-render" }
explorer-core = { path = "crates/explorer-core" }
explorer-api = { path = "crates/explorer-api" }
explorer-ffi = { path = "crates/explorer-ffi" }
explorer-test-support = { path = "crates/explorer-test-support" }
explorer-jscore = { path = "crates/explorer-jscore" }

# Crates externes — pur Rust uniquement (AGENTS.md §4.2),
# pin mineur, ≥ 7 jours depuis publication.
thiserror = "2.0"
# Stack texte ADR-0009 (explorer-layout) — shaping/itemisation
# purs, aucun I/O (fontdb reste en couche infra, port
# FontSource côté layout).
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
ttf-parser = "0.25"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# Moteur regex de explorer-jscore (pur Rust) — lookahead/backrefs non
# supportés, dégradation SyntaxError documentée (ADR-0007).
regex = "1.11"
# Backtracker hybride pur Rust (regex-automata + backtrack) —
# lookaround et backrefs JS ((?=), (?<=, refs numerotees et
# nommees) que regex ne compile pas (JS-C3, ADR-0007).
fancy-regex = "0.16"
# IDNA/punycode UTS-46 pour explorer-net::url (ADR-0002, étape 3) —
# pur Rust, pas de *-sys.
idna = "1.0"
# Tables Unicode XID_Start/XID_Continue pour les identifiants JS
# (explorer-jscore lexer) — `char::is_alphabetic` n'implémente ni UAX #31
# ni les exclusions Pattern_Syntax (ex. U+2E2F). Pur Rust.
unicode-ident = "1.0"
# `String.prototype.normalize` (explorer-jscore JS-C14) — tables de
# normalisation Unicode réelles (NFC/NFD/NFKC/NFKD). Pur Rust.
unicode-normalization = "0.1"
# Entiers arbitraires pour BigInt (explorer-jscore JS-C7) — pur Rust,
# pas de GMP. num-traits pour les casts BigInt→i64/u64/f64.
num-bigint = "0.4"
num-traits = "0.2"
# Sonde de pile restante pour les descentes récursives de
# explorer-jscore (JS-C41 — parseur/évaluateur/appels bornés par la
# pile réelle, pas par des constantes calibrées). Pur Rust
# (`psm`, asm inline) — mécanisme utilisé par rustc.
stacker = "0.1.25"
# Pile réseau explorer-net (ADR-0002) — tokio sockets/timers,
# httparse wire-format HTTP/1.1, async-trait pour les transports
# injectables (HttpTransport/Connector dyn-compatibles).
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "signal", "sync"] }
axum = { version = "0.8", features = ["json", "tokio"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }
httparse = "1.9"
async-trait = "0.1"
# TLS explorer-net (ADR-0002, étape 5) — rustls + webpki-roots.
# Provider crypto `ring` : exception *-sys* consignée dans l'ADR —
# aucune pile TLS viable n'est 100 % Rust ; `ring` se build sur
# Windows sans cmake (contrairement à aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
# Décodage corps explorer-net (ADR-0002, étape 6) — pur Rust :
# flate2 sur miniz_oxide (gzip/deflate), brotli, encoding_rs
# (transcodage charset WHATWG — la référence de Firefox).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "7"
encoding_rs = "0.8"
# Cookies explorer-net (ADR-0002, étape 7) — Public Suffix List
# embarquée : sans elle, un jar naïf accepte les supercookies
# `.co.uk`. Pur Rust.
psl = "2"
# Décodeurs d'images explorer-render (étape 37) — `image` est LA
# référence pur Rust (png/jpeg/gif/webp embarqués, aucun *-sys) ;
# features réduites aux formats du MVP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# SVG statique explorer-render (étape 45) — `resvg`/`usvg` sont
# la référence pur Rust (tiny-skia en dessous, aucun *-sys) ;
# version appariée à notre tiny-skia 0.11.
resvg = "0.45.1"
# HTTP/2 explorer-net (étape 41) — `h2` est l'implémentation
# framing/multiplexage pur Rust de référence (équipe tokio/hyper,
# aucun *-sys) ; `http` fournit les types Request/Response du
# codec — comme httparse pour HTTP/1.1, la couche session/
# politique reste écrite ici.
h2 = "0.4"
http = "1"
bytes = "1"
# Benchmarks pipeline (étape 39) — référence Rust, pur Rust,
# dev-dependency uniquement (jamais dans le code livré).
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
