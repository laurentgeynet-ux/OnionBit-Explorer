<!doctype html><html><body>
<sl-button>probe</sl-button>
<div id="v1">P</div>
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
<script>
setTimeout(() => {
  const C = customElements.get('sl-button');
  let msg = 'get=' + typeof C;
  if (C) {
    try { new C(); msg += ' ctor=OK'; }
    catch(e) { msg += ' ctor=ERR:' + String(e.stack || e.message || e).slice(0,300); }
  }
  document.getElementById('v1').textContent = msg;
}, 6000);
</script>
</body></html>
