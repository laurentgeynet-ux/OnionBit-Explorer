<!doctype html><html><body>
<sl-button style="display:none">x</sl-button>
<div id="v1">P</div>
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
<script>
window.__att = 0;
const _orig = HTMLElement.prototype.attachShadow;
HTMLElement.prototype.attachShadow = function(o) { window.__att++; return _orig.call(this, o); };
setTimeout(() => {
  let hits = '';
  const b = document.createElement('sl-button');
  document.body.appendChild(b);
  hits += 'app ';
  try { if (b.performUpdate) { b.performUpdate(); hits += 'pu-ok '; } else hits += 'no-pu '; }
  catch(e) { hits += 'puErr:' + String(e.stack||e.message||e).slice(0,300) + ' '; }
  hits += 'att=' + window.__att + ' sr=' + (b.shadowRoot ? 'SR' : 'null');
  document.getElementById('v1').textContent = hits;
}, 8000);
</script>
</body></html>
