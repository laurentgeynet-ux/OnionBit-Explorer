<!doctype html><html><body>
<sl-button style="display:none">x</sl-button>
<div id="v1">P</div>
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
<script>
setTimeout(() => {
  const b = document.createElement('sl-button');
  document.body.appendChild(b);
  setTimeout(() => {
    const fmt = v => v === undefined ? 'U' : v === null ? 'N' : typeof v;
    document.getElementById('v1').textContent =
      'instProps=' + fmt(b.__instanceProperties) +
      ' renderRoot=' + fmt(b.renderRoot) +
      ' connP=' + fmt(b.__connectedPromise) +
      ' updPend=' + fmt(b.__isUpdatePending) +
      ' sr=' + (b.shadowRoot ? 'SR' : 'null');
  }, 500);
}, 8000);
</script>
</body></html>
