<!doctype html><html><body>
<sl-button style="display:none">x</sl-button>
<div id="v1">P</div>
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
<script>
window.__att = 0; window.__puErr = 'none'; window.__ruErr = 'none';
const _orig = HTMLElement.prototype.attachShadow;
HTMLElement.prototype.attachShadow = function(o) { window.__att++; return _orig.call(this, o); };
setTimeout(() => {
  const b = document.createElement('sl-button');
  document.body.appendChild(b);
  // wrap performUpdate — capture le throw interne LitElement
  if (b.performUpdate) {
    const o = b.performUpdate.bind(b);
    b.performUpdate = function(){ try { return o(); } catch(e){ window.__puErr = String(e.stack||e.message||e).slice(0,400); throw e; } };
  }
  // force une mise à jour — si le schedule auto a échoué
  try { if (b.requestUpdate) b.requestUpdate(); else window.__ruErr='no-ru'; }
  catch(e) { window.__ruErr = String(e.stack||e.message||e).slice(0,300); }
  setTimeout(() => {
    document.getElementById('v1').textContent =
      'att=' + window.__att +
      ' upd=' + (typeof b.update) +
      ' ruErr=' + window.__ruErr +
      ' puErr=' + window.__puErr;
  }, 800);
}, 8000);
</script>
</body></html>
