<!doctype html><html><body>
<div id="v1">P</div>
<script>
async function probe() {
  let msg = 'fetch=' + typeof fetch + ' xhr=' + typeof XMLHttpRequest;
  if (typeof fetch === 'function') {
    try {
      const r = await fetch('/probe4.html');
      const t = await r.text();
      msg += ' status=' + r.status + ' len=' + t.length;
    } catch(e) { msg += ' ERR:' + String(e.stack||e.message||e).slice(0,250); }
  }
  if (typeof XMLHttpRequest === 'function') {
    try {
      const ok = await new Promise((res, rej) => {
        const x = new XMLHttpRequest();
        x.onload = () => res('xhr-ok:' + x.status);
        x.onerror = () => rej('xhr-fail');
        x.open('GET', '/probe4.html'); x.send();
      });
      msg += ' ' + ok;
    } catch(e) { msg += ' XERR:' + String(e.message||e).slice(0,150); }
  }
  document.getElementById('v1').textContent = msg;
}
probe();
</script>
</body></html>
