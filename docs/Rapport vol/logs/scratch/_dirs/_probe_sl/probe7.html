<!doctype html><html><body>
<x-doc></x-doc>
<div id="v1">P</div>
<script>
window.__ccDoc = 0; window.__ccApp = 0;
customElements.define('x-doc', class extends HTMLElement {
  connectedCallback() { window.__ccDoc++; }
});
customElements.define('x-app', class extends HTMLElement {
  connectedCallback() { window.__ccApp++; }
});
const x = document.createElement('x-app');
document.body.appendChild(x);
setTimeout(() => {
  document.getElementById('v1').textContent =
    'ccDoc=' + window.__ccDoc + ' ccApp=' + window.__ccApp;
}, 4000);
</script>
</body></html>
