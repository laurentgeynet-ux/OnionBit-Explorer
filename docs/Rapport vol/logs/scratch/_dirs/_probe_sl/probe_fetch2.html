<!doctype html><html><body>
<div id="v1">P</div>
<div id="v2">P</div>
<script>
document.getElementById('v1').textContent = 'sync=' + typeof fetch + ',' + typeof XMLHttpRequest;
(async () => {
  try {
    const r = await fetch('/probe4.html');
    document.getElementById('v2').textContent = 'RES status=' + r.status;
  } catch(e) { document.getElementById('v2').textContent = 'ERR:' + String(e.stack||e.message||e).slice(0,250); }
})();
</script>
</body></html>
