[package]
name = "explorer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Session : onglets, navigation, pipeline fetch→parse→style→layout→render, evenements"

[lints]
workspace = true

[dependencies]
explorer-css.workspace = true
explorer-dom.workspace = true
explorer-html.workspace = true
explorer-js.workspace = true
explorer-layout.workspace = true
explorer-net.workspace = true
explorer-render.workspace = true
# `FuturesUnordered` du scheduler de sous-ressources (étape 50) —
# la feature `std` est exigée (le workspace épingle `default-features = false`).
futures-util = { workspace = true, features = ["std"] }
# Validation `pattern` des formulaires (étape 54) — pur Rust,
# déjà dépendance du workspace pour dillo-js.
regex.workspace = true
# Sérialisation JSON du store de profil (étape 61) — les formes
# filaires `Raw*` vivent dans `profile_store`, jamais sur les DTO.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
image.workspace = true
async-trait.workspace = true
criterion.workspace = true
explorer-test-support.workspace = true

[[bench]]
name = "pipeline"
harness = false
