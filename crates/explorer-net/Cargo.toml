[package]
name = "explorer-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "URL, DNS, HTTP/1.1, TLS, decodage, cookies, cache — seul crate autorise a ouvrir des sockets"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
idna.workspace = true
tokio.workspace = true
httparse.workspace = true
async-trait.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
flate2.workspace = true
brotli.workspace = true
encoding_rs.workspace = true
psl.workspace = true
h2.workspace = true
http.workspace = true
bytes.workspace = true
futures-util.workspace = true
axum.workspace = true
# Provider crypto de `crypto.subtle` (JS-C79) — même `ring`
# que rustls (exception ADR-0002 déjà consignée).
ring.workspace = true
# `RSA-OAEP` (JS-C231) — `rsa` pur Rust (RustCrypto) +
# `sha2` pour le padding OAEP : `ring` ne chiffre pas RSA.
rsa.workspace = true
sha2.workspace = true

[dev-dependencies]
# Certificats de test TLS auto-signés (étape 5) — pur Rust,
# même provider `ring` que rustls.
rcgen = "0.13"
