[package]
name = "explorer-boa-diff"
description = "Oracle différentiel jscore ↔ boa — comparaison d'issues d'évaluation (outil de conformité, jamais en production)"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "explorer_boa_diff"
path = "src/lib.rs"

[[bin]]
name = "boa-diff"
path = "src/main.rs"

[[bin]]
name = "boa-surface"
path = "src/bin/surface.rs"

[dependencies]
explorer-jscore = { workspace = true }
# Oracle : checkout local de boa (path absolu — dossier de test ;
# ne jamais le remplacer par une dep de prod). Features par
# défaut : pas d'`intl` (poids deps).
boa_engine = { path = "D:/Projet/SourceRust/boa/core/engine", features = ["annex-b"] }

[lints]
workspace = true
