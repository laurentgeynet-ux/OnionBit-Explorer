name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates rapides — formatage, lint, doc. Échoue vite.
  lint:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps

  # Tests du domaine + produit, hors moteur JS (le plus lourd).
  test-workspace:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: test (hors jscore)
        run: cargo test --workspace --exclude explorer-jscore

  # explorer-jscore à part — la suite hostile/test262 est lourde
  # en debug par design (interpréteur non optimisé, voir AGENTS §3).
  test-jscore:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: test jscore
        run: cargo test -p explorer-jscore

  flutter:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        # --no-fatal-infos : stable 3.50 déprécie material.dart
        # (migration material_ui = chantier, pas une erreur)
        run: flutter analyze --no-fatal-infos
      - name: test
        working-directory: app
        run: flutter test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit (CVE sur le graphe de deps)
        run: cargo audit
